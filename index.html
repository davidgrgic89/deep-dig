<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Deep Dig — An Explorer's Dream</title>
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/fonts/PressStart2P.ttf') format('truetype');
      }
      html, body {
        margin: 0;
        padding: 0;
        background: #0b0a12;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* preload font so Phaser text uses it immediately */
      #fontloader {
        font-family: 'Press Start 2P';
        position: absolute;
        left: -1000px;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="fontloader">.</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
